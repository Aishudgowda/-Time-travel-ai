<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Time Travel AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #312e81, #581c87);
      color: white;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      text-align: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin: 10px 0;
    }

    .subtitle {
      color: #d1d5db;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 25px;
      padding: 25px;
      backdrop-filter: blur(15px);
    }

    .upload {
      display: block;
      border: 2px dashed rgba(255,255,255,0.4);
      border-radius: 20px;
      padding: 35px 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload:hover {
      background: rgba(255,255,255,0.08);
    }

    .upload input {
      display: none;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .upload-title {
      font-size: 20px;
      font-weight: bold;
    }

    .upload-text {
      color: #d1d5db;
      margin-top: 8px;
      font-size: 14px;
    }

    #preview {
      display: none;
      width: 100%;
      max-width: 500px;
      max-height: 500px;
      object-fit: contain;
      margin: 20px auto;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.25);
    }

    .choose-title {
      font-size: 18px;
      font-weight: bold;
      margin: 25px 0 15px;
    }

    .years {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .year {
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: white;
      padding: 12px 22px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .year.selected {
      background: white;
      color: #312e81;
      font-weight: bold;
    }

    .generate {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: white;
      color: #312e81;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      line-height: 1.5;
      color: #e5e7eb;
    }

    #resultTitle {
      display: none;
      font-size: 20px;
      font-weight: bold;
      margin-top: 25px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 29px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">⌛ TIME TRAVEL AI</div>

    <h1>See Yourself Across Time</h1>

    <p class="subtitle">
      Upload your photo and discover how you could look
      in the past or future.
    </p>

    <div class="card">

      <!-- PHOTO UPLOAD -->
      <label class="upload">

        <input
          type="file"
          id="photoInput"
          accept="image/*"
        >

        <div class="upload-icon">📸</div>

        <div class="upload-title">
          Upload Your Photo
        </div>

        <div class="upload-text">
          Choose a clear photo to begin
        </div>

      </label>


      <!-- ORIGINAL PHOTO PREVIEW -->
      <img
        id="preview"
        alt="Uploaded photo preview"
      >


      <!-- YEAR -->
      <div class="choose-title">
        Choose your time period
      </div>

      <div class="years">

        <button
          class="year"
          onclick="selectYear(this, '2000')"
        >
          🕰️ 2000
        </button>

        <button
          class="year"
          onclick="selectYear(this, 'bw')"
        >
          📅 2026
        </button>

        <button
          class="year"
          onclick="selectYear(this, '2075')"
        >
          🚀 2075
        </button>

      </div>


      <!-- GENERATE -->
      <button
        class="generate"
        id="generateButton"
        onclick="generate()"
      >
        ✨ Generate My Time Travel
      </button>


      <!-- MESSAGE -->
      <div id="message"></div>


      <!-- RESULT -->
      <div id="resultTitle">
        ✨ Your Time Travel Result
      </div>

      <img
        id="result"
        alt="Generated time travel image"
        style="
          display:none;
          width:100%;
          max-width:500px;
          max-height:600px;
          object-fit:contain;
          margin:20px auto;
          border-radius:18px;
        "
      >

    </div>

  </div>


<script>

let selectedYear = "";


// -------------------------
// YEAR SELECTION
// -------------------------

function selectYear(button, year) {

  document.querySelectorAll(".year").forEach(function(btn) {
    btn.classList.remove("selected");
  });

  button.classList.add("selected");

  selectedYear = year;
}


// -------------------------
// PHOTO PREVIEW
// -------------------------

document
  .getElementById("photoInput")
  .addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
      return;
    }

    const preview = document.getElementById("preview");

    const imageURL = URL.createObjectURL(file);

    preview.src = imageURL;

    preview.style.display = "block";

    document.getElementById("message").innerText =
      "✅ Photo selected successfully.";

});


// -------------------------
// COMPRESS IMAGE
// -------------------------

function prepareImage(file) {

  return new Promise(function(resolve, reject) {

    const img = new Image();

    img.onload = function() {

      const maxSize = 480;

      let width = img.width;
      let height = img.height;

      if (width > height && width > maxSize) {

        height = height * maxSize / width;
        width = maxSize;

      } else if (height > maxSize) {

        width = width * maxSize / height;
        height = maxSize;

      }

      const canvas = document.createElement("canvas");

      canvas.width = Math.round(width);
      canvas.height = Math.round(height);

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      resolve(
        canvas.toDataURL(
          "image/jpeg",
          0.9
        )
      );

    };

    img.onerror = function() {
      reject(
        new Error("Could not process the photo.")
      );
    };

    img.src = URL.createObjectURL(file);

  });

}


// -------------------------
// GENERATE AI IMAGE
// -------------------------

async function generate() {

  const file =
    document.getElementById("photoInput").files[0];

  const message =
    document.getElementById("message");

  const result =
    document.getElementById("result");

  const resultTitle =
    document.getElementById("resultTitle");

  const button =
    document.getElementById("generateButton");


  // PHOTO CHECK

  if (!file) {

    message.innerText =
      "⚠️ Please upload a photo first.";

    return;
  }


  // YEAR CHECK

  if (!selectedYear) {

    message.innerText =
      "⚠️ Please choose a year first.";

    return;
  }


  // START

  button.disabled = true;

  button.innerText =
    "✨ Creating your time-travel photo...";

  message.innerText =
    "⏳ AI is creating your photo. Please wait...";

  result.style.display = "none";

  resultTitle.style.display = "none";


  try {

    // Prepare image

    const image =
      await prepareImage(file);


    // Send to Worker

const response = await fetch("https://time-travel-ai.aishudgowda2004.workers.dev/api/generate", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          image: image,

          option: selectedYear

        })

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "AI generation failed."
      );

    }


    if (!data.image) {

      throw new Error(
        "AI did not return an image."
      );

    }


    // SHOW RESULT

    result.src = data.image;

    result.style.display = "block";

    resultTitle.style.display = "block";

    message.innerText =
      "🎉 Your " +
      selectedYear +
      " time-travel photo is ready!";


    // Scroll to result

    result.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });


  } catch (error) {

    console.error(error);

    message.innerText =
      "❌ " +
      (error.message ||
      "Something went wrong.");

  }


  button.disabled = false;

  button.innerText =
    "✨ Generate My Time Travel";

}

</script>

</body>
</html>
