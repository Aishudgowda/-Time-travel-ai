<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Time Travel AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #080b18, #171b3d);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 50px 20px;
      text-align: center;
    }

    .logo {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 52px;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .subtitle {
      color: #b8bdd8;
      font-size: 18px;
      max-width: 620px;
      margin: 0 auto 40px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 25px;
      padding: 35px;
      backdrop-filter: blur(15px);
    }

    .upload {
      display: block;
      border: 2px dashed #777da8;
      border-radius: 20px;
      padding: 45px 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload:hover {
      border-color: white;
      background: rgba(255,255,255,0.05);
    }

    .upload input {
      display: none;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .upload-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .upload-text {
      color: #aaaec7;
    }

    #preview {
      display: none;
      width: 100%;
      max-width: 350px;
      max-height: 400px;
      object-fit: cover;
      margin: 25px auto;
      border-radius: 18px;
    }

    .choose-title {
      margin-top: 30px;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .years {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .year {
      padding: 14px 24px;
      border-radius: 14px;
      border: 1px solid #555b82;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .year.selected {
      background: white;
      color: #101226;
      border-color: white;
    }

    .generate {
      width: 100%;
      max-width: 400px;
      padding: 17px;
      border: none;
      border-radius: 15px;
      background: white;
      color: #101226;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:hover {
      transform: translateY(-1px);
    }

    #message {
      margin-top: 20px;
      color: #b8bdd8;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 38px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">⌛ TIME TRAVEL AI</div>

    <h1>See Yourself Across Time</h1>

    <p class="subtitle">
      Upload your photo and discover an AI-created version of yourself
      in the past or future.
    </p>

    <div class="card">

      <label class="upload">
<input type="file" id="photoInput" accept="image/*"
onchange="document.getElementById('preview').src=URL.createObjectURL(this.files[0]); document.getElementById('preview').style.display='block';">
        <div class="upload-icon">📸</div>

        <div class="upload-title">
          Upload Your Photo
        </div>

        <div class="upload-text">
          Choose a clear photo to begin
        </div>
      </label>

      <img id="preview" alt="Uploaded photo">

      <div class="choose-title">
        Choose your time period
      </div>

      <div class="years">

        <button class="year" onclick="selectYear(this, '2000')">
          🕰️ 2000
        </button>

        <button class="year" onclick="selectYear(this, '2026')">
          📅 2026
        </button>

        <button class="year" onclick="selectYear(this, '2075')">
          🚀 2075
        </button>

      </div>

      <button class="generate" onclick="generate()">
        Generate My Time Travel ✨
      </button>

      <div id="message"></div>

    </div>

  </div>

  <script>

    let selectedYear = "";

    function selectYear(button, year) {

      document.querySelectorAll(".year").forEach(function(btn) {
        btn.classList.remove("selected");
      });

      button.classList.add("selected");

      selectedYear = year;
    }

    document.getElementById("photoInput").addEventListener("change", function(event) {

      const file = event.target.files[0];

      if (file) {

        const preview = document.getElementById("preview");

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";
      }

    });

    async function generate() {

  const file = document.getElementById("photoInput").files[0];
  const message = document.getElementById("message");
  const preview = document.getElementById("preview");

  if (!file) {
    message.innerText = "Please upload a photo first.";
    return;
  }

  if (!selectedYear) {
    message.innerText = "Please choose a year first.";
    return;
  }

  message.innerText = "✨ Creating your time-travel photo... Please wait.";

  try {

    const reader = new FileReader();

    reader.onload = async function () {

      const image = reader.result;

      const response = await fetch("/api/generate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          image: image,
          year: selectedYear
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "AI generation failed");
      }

      if (!data.image) {
        throw new Error("No image received from AI");
      }

      preview.src = data.image;
      preview.style.display = "block";

      message.innerText =
        "✨ Your " + selectedYear + " time-travel photo is ready!";

    };

    reader.onerror = function () {
      throw new Error("Could not read the photo");
    };

    reader.readAsDataURL(file);

  } catch (error) {

    console.error(error);

    message.innerText =
      "❌ " + (error.message || "Something went wrong.");

  }
}

      
    }

  </script>

</body>
</html>
