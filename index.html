<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Travel AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7ff;
      color: #17172b;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      font-size: 46px;
      margin-top: 50px;
    }

    .subtitle {
      font-size: 18px;
      margin: 18px auto 35px;
      color: #666;
      max-width: 600px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    .upload {
      border: 2px dashed #aaa;
      border-radius: 18px;
      padding: 45px 20px;
      cursor: pointer;
    }

    .upload:hover {
      border-color: #555;
    }

    .upload input {
      display: none;
    }

    .upload-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .upload-text {
      color: #777;
    }

    .years {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .year {
      padding: 15px 28px;
      border: 2px solid #ddd;
      border-radius: 14px;
      background: white;
      cursor: pointer;
      font-size: 17px;
    }

    .year.selected {
      border-color: #111;
      background: #111;
      color: white;
    }

    .generate {
      border: none;
      background: #111;
      color: white;
      padding: 17px 35px;
      border-radius: 14px;
      font-size: 18px;
      cursor: pointer;
    }

    .generate:hover {
      opacity: 0.85;
    }

    #preview {
      max-width: 100%;
      max-height: 350px;
      margin-top: 25px;
      border-radius: 16px;
      display: none;
    }

    .result {
      margin-top: 30px;
      color: #666;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>See Yourself Across Time</h1>

    <p class="subtitle">
      Upload your photo and imagine how you could look in different eras.
    </p>

    <div class="card">

      <label class="upload">
        <input type="file" accept="image/*" id="photoInput">
        <div class="upload-title">📸 Upload Your Photo</div>
        <div class="upload-text">
          Choose a clear photo of yourself
        </div>
      </label>

      <img id="preview" alt="Photo preview">

      <div class="years">
        <button class="year" onclick="selectYear(this, '2000')">
          🕰️ 2000
        </button>

        <button class="year" onclick="selectYear(this, '2026')">
          📅 2026
        </button>

        <button class="year" onclick="selectYear(this, '2075')">
          🚀 2075
        </button>
      </div>

      <button class="generate" onclick="generatePreview()">
        Generate My Time Travel
      </button>

      <div class="result" id="result"></div>

    </div>

  </div>

  <script>
    let selectedYear = "";

    function selectYear(button, year) {
      document.querySelectorAll(".year").forEach(btn => {
        btn.classList.remove("selected");
      });

      button.classList.add("selected");
      selectedYear = year;
    }

    document.getElementById("photoInput").addEventListener("change", function(event) {
      const file = event.target.files[0];

      if (file) {
        const preview = document.getElementById("preview");
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
      }
    });

    function generatePreview() {
      if (!selectedYear) {
        document.getElementById("result").innerText =
          "Please choose a year first.";
        return;
      }

      document.getElementById("result").innerText =
        "AI generation will appear here.";
    }
  </script>

</body>
</html>
